<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Михаил Петров · AI Intern Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f8; --bg-glow:#ffffff; --panel:#ffffff; --panel2:#ffffff; --line:#e1e8ee;
  --shadow:0 1px 2px rgba(0,35,64,.05),0 8px 24px rgba(0,35,64,.07);
  --text:#00233F; --soft:#3f5a72; --faint:#7a8fa3;
  --lime:#9be000;   --lime-t:#00233F;  --lime-f:#b4ff00;  --lime-i:#00233F;
  --cyan:#1ea7dc;   --cyan-t:#0a6d94;  --cyan-f:#5cc8f0;  --cyan-i:#00233F;
  --sand:#00233F;   --sand-t:#00233F;  --sand-f:#00233F;  --sand-i:#ffffff;
  --amber:#ff9f1c;  --amber-t:#b35a00; --amber-f:#ffb22e; --amber-i:#00233F;
  --violet:#7c5cff; --violet-t:#5a3cdc;--violet-f:#7c5cff;--violet-i:#ffffff;
  --brand:#b4ff00; --navy:#00233F; --tile:#00233F; --chip:#00233F; --chip-ink:#ffffff; --scrim:rgba(0,35,64,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#00233F; --bg-glow:#063a63; --panel:#06304f; --panel2:#0b3a5e; --line:rgba(255,255,255,.12); --shadow:0 10px 30px rgba(0,0,0,.25);
    --text:#ffffff; --soft:#b9c9d8; --faint:#7f97ad;
    --lime:#b4ff00; --cyan:#5fd8f0; --sand:#f2e3c6; --amber:#ffc65c; --violet:#b9a3ff;
    --tile:#00192f; --chip:#b4ff00; --chip-ink:#00233F; --scrim:rgba(0,10,20,.55);
    --lime-t:#b4ff00; --lime-f:#b4ff00; --lime-i:#00233F;
    --cyan-t:#5fd8f0; --cyan-f:#5fd8f0; --cyan-i:#00233F;
    --sand-t:#f2e3c6; --sand-f:#f2e3c6; --sand-i:#00233F;
    --amber-t:#ffc65c; --amber-f:#ffc65c; --amber-i:#00233F;
    --violet-t:#b9a3ff; --violet-f:#b9a3ff; --violet-i:#00233F;
  }
}
:root[data-theme="dark"]{
  --bg:#00233F; --bg-glow:#063a63; --panel:#06304f; --panel2:#0b3a5e; --line:rgba(255,255,255,.12); --shadow:0 10px 30px rgba(0,0,0,.25);
  --text:#ffffff; --soft:#b9c9d8; --faint:#7f97ad;
  --lime:#b4ff00; --cyan:#5fd8f0; --sand:#f2e3c6; --amber:#ffc65c; --violet:#b9a3ff;
  --tile:#00192f; --chip:#b4ff00; --chip-ink:#00233F; --scrim:rgba(0,10,20,.55);
    --lime-t:#b4ff00; --lime-f:#b4ff00; --lime-i:#00233F;
    --cyan-t:#5fd8f0; --cyan-f:#5fd8f0; --cyan-i:#00233F;
    --sand-t:#f2e3c6; --sand-f:#f2e3c6; --sand-i:#00233F;
    --amber-t:#ffc65c; --amber-f:#ffc65c; --amber-i:#00233F;
    --violet-t:#b9a3ff; --violet-f:#b9a3ff; --violet-i:#00233F;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:Manrope,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.4;color:var(--text);
  background:radial-gradient(1200px 760px at 50% 40%,var(--bg-glow) 0%,var(--bg) 62%) fixed;min-height:100vh;
  transition:background-color .25s,color .25s;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:10px}
.wrap{max-width:1680px;margin:0 auto;padding:22px max(32px,env(safe-area-inset-right)) 0 max(32px,env(safe-area-inset-left))}
:root{--ring:170px;--cw:250px;--hubw:128px;--gap-c:60px;--gap-b:52px}
.h-touch{display:none}
@media (hover:none){.h-ptr{display:none}.h-touch{display:inline}}

/* ---------- top ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px 24px;flex-wrap:wrap}
.eyebrow{color:var(--lime-t);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.top h1{font-size:28px;font-weight:800;margin-top:4px;letter-spacing:-.01em}
.hint{color:var(--faint);font-size:12.5px;margin-top:4px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--soft)}
.seg button[aria-pressed="true"],.seg button[aria-pressed="true"]:hover{background:#b4ff00;color:#00233F;-webkit-text-fill-color:#00233F;font-weight:800;box-shadow:0 0 0 1px rgba(0,35,64,.08)}
.tbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;
  background:var(--panel);font-weight:700;font-size:12.5px;color:var(--soft);transition:color .15s,border-color .15s}
.tbtn:hover,.seg button:hover{color:var(--text)}
.tbtn.primary{background:var(--brand);color:var(--navy);border-color:var(--brand)}
.tbtn.primary:hover{filter:brightness(1.05);color:var(--navy)}
.tbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.nextup{margin-top:16px}
.nextup .nl{color:var(--faint);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}
.nlist{display:flex;gap:10px;flex-wrap:wrap}
.nx{display:inline-flex;align-items:center;gap:12px;padding:8px;border-radius:14px;max-width:300px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s}
.nx:hover{transform:translateY(-1px);border-color:var(--lime)}
.nx .cd{flex:none;min-width:48px;background:color-mix(in srgb,var(--lime) 16%,transparent);color:var(--text);border-radius:10px;padding:6px 8px;text-align:center;line-height:1}
.nx:first-child .cd{background:var(--brand);color:var(--navy)}
.nx .cd b{display:block;font-size:20px;font-weight:800}
.nx .cd span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.nx .tx{min-width:0}
.nx .tx small{display:block;color:var(--faint);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.nx .tx div{font-weight:700;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nx .go{flex:none}

/* ---------- map ---------- */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 250px minmax(0,1fr);gap:0 60px;align-items:center;margin-top:18px}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wire{fill:none;stroke-linecap:round;transition:stroke-opacity .2s,stroke-width .2s}
.wire.hot{stroke-opacity:1!important;stroke-width:3px!important;stroke-dasharray:6 8;animation:flow .9s linear infinite}
.map.focus .wire:not(.hot){stroke-opacity:.15!important}
@keyframes flow{to{stroke-dashoffset:-28}}
.wire.intro{animation:drawin 1s ease forwards}
@keyframes drawin{to{stroke-dashoffset:0}}

.side{display:flex;flex-direction:column;gap:24px;position:relative;z-index:1}
.branch{display:grid;align-items:center;gap:0 52px}
.left .branch{grid-template-columns:minmax(0,1fr) 128px}
.right .branch{grid-template-columns:128px minmax(0,1fr)}
.left .hub{order:2}
.leaves{display:flex;flex-direction:column;gap:10px}
.branch.closed .leaves{display:none}
.left .branch.closed .hub{grid-column:2}

.hub{position:relative;border:1.5px solid var(--c);color:var(--ct);background:color-mix(in srgb,var(--c) 11%,var(--panel));
  border-radius:999px;padding:10px 12px;text-align:center;font-weight:800;font-size:12.5px;line-height:1.25;
  box-shadow:0 0 22px color-mix(in srgb,var(--c) 16%,transparent);transition:transform .15s,background .2s}
.hub:hover{transform:scale(1.05);background:color-mix(in srgb,var(--c) 20%,var(--panel))}
.hub .count{display:none;position:absolute;top:-11px;right:-11px;min-width:22px;height:22px;border-radius:11px;
  background:var(--cf);color:var(--ci);font-size:11px;line-height:22px;padding:0 6px}
.branch.closed .hub .count{display:block}

/* nodes */
.node{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) 18px;gap:12px;align-items:center;width:100%;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 10px;
  box-shadow:var(--shadow);transition:transform .18s,border-color .18s,box-shadow .18s;
  opacity:0;animation:pop .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*55ms + 150ms)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.node::before{content:"";position:absolute;inset:-1px;border-radius:14px;border:2px solid var(--c);opacity:0;transition:opacity .18s}
.node:hover,.node.sel{transform:translateY(-2px)}
.node:hover::before,.node.sel::before{opacity:1}
.tile{width:48px;height:48px;border-radius:12px;background:var(--tile);display:grid;place-items:center;transition:transform .25s}
.tile img{width:32px;height:32px}
.node:hover .tile{transform:rotate(-6deg) scale(1.06)}
.tile.photo{border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--c)}
.tile.photo img{width:100%;height:100%;object-fit:cover}
.node:hover .tile.photo{transform:scale(1.06)}
.stack{display:flex;align-items:center;height:48px;padding-left:7px}
.av{width:34px;height:34px;border-radius:50%;margin-left:-7px;background:var(--tile);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:800;letter-spacing:-.02em;
  overflow:hidden;box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--c);flex:none;transition:transform .2s}
.av img{width:100%;height:100%;object-fit:cover}
.stack .av:nth-child(1){z-index:3}.stack .av:nth-child(2){z-index:2}.stack .av{position:relative}
.node:hover .av{transform:translateY(-2px)}
.node:hover .av:nth-child(2){transition-delay:.04s}.node:hover .av:nth-child(3){transition-delay:.08s}
.node.hasstack{grid-template-columns:auto minmax(0,1fr) 18px}
.team{display:grid;gap:10px}
.team div{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px}
.team .av{width:44px;height:44px;margin:0;font-size:14px}
.node[data-id=hr] .nname{font-size:13px;line-height:1.3;font-weight:700}
.label{color:var(--ct);font-weight:800;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:10px;letter-spacing:.02em;font-weight:800;color:var(--ci);background:var(--cf);border-radius:999px;padding:1px 7px;text-transform:none}
.nname{font-size:16px;font-weight:800;margin-top:2px;line-height:1.2}
.nname.muted{color:var(--faint);font-style:italic;font-weight:600}
.peek{color:var(--faint);font-size:12px;margin-top:2px}
.arrow{width:18px;height:18px;fill:none;stroke:var(--faint);stroke-width:2;transition:transform .2s,stroke .2s}
.node:hover .arrow{transform:translateX(3px);stroke:var(--c)}
.right .node.wide{grid-template-columns:48px minmax(0,1fr) 18px}
.mini{display:flex;align-items:center;gap:8px;margin-top:6px}
.bar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:3px;transition:width .4s}
.mini span{font-size:11px;font-weight:800;color:var(--ct);white-space:nowrap}

/* center */
.center{position:relative;z-index:2;text-align:center;justify-self:center;width:var(--cw)}
.ringwrap{position:relative;width:var(--ring);height:var(--ring);margin:0 auto 12px}
.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .trk{stroke:color-mix(in srgb,var(--lime) 18%,transparent)}
.ring .val{stroke:var(--lime);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.avatar{position:absolute;inset:calc(var(--ring)*.118);border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--navy);
  font-size:calc(var(--ring)*.25);font-weight:800;box-shadow:0 12px 50px rgba(180,255,0,.3);transition:transform .25s}
.avatar:hover{transform:scale(1.05) rotate(-3deg)}
.center h2{font-size:23px;font-weight:800;line-height:1.15}
.center .pos{color:var(--lime-t);font-weight:700;margin-top:6px;font-size:13.5px}
.center .prog{color:var(--soft);font-size:12px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.center .prog b{color:var(--text)}

/* city */
.city{margin-top:34px;height:150px;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.city .track{display:flex;height:100%;width:max-content;animation:pan 140s linear infinite}
.city:hover .track{animation-play-state:paused}
.city img{height:100%;display:block}
@keyframes pan{to{transform:translateX(-50%)}}
.foot{max-width:1680px;margin:0 auto;padding:10px 32px 20px;display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--faint);font-size:12px}
.foot button{display:inline-flex;align-items:center;gap:7px;color:var(--faint)}
.foot button:hover{color:var(--text)}
.foot i{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--panel);z-index:21;display:flex;flex-direction:column;
  transform:translateX(105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s linear .35s;box-shadow:-20px 0 60px rgba(0,0,0,.25);border-left:1px solid var(--line)}
body.dopen .scrim{opacity:1;pointer-events:auto}
body.dopen .drawer{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s}
body.dopen{overflow:hidden}
.hero{position:relative;background:#b4ff00;height:210px;flex:none;z-index:2}
.hero img.ill{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:14px 20px 0;transform:scale(1.04);transition:transform .6s}
body.dopen .hero img.ill{transform:none}
.hero .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
.hero .x svg{width:16px;height:16px;stroke:#fff;stroke-width:2.4;fill:none}
.hero .tile{position:absolute;left:22px;bottom:-24px;width:56px;height:56px;border-radius:14px;background:var(--navy);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.hero .tile img{width:38px;height:38px}
.hero .tile.photo{border-radius:50%;width:76px;height:76px;bottom:-34px;overflow:hidden;box-shadow:0 0 0 4px var(--panel),0 6px 18px rgba(0,0,0,.25)}
.hero .tile.photo img{width:100%;height:100%;object-fit:cover}
.dbody.ph{padding-top:50px}
.dbody{flex:1;overflow:auto;padding:38px 24px 24px}
.dbody .label{font-size:11px}
.dbody h3{font-size:24px;font-weight:800;margin-top:4px;line-height:1.15}
.dbody .desc{color:var(--soft);font-size:14px;margin-top:8px}
.sec{margin-top:22px}
.sec h4{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.steps{list-style:none;position:relative}
.steps li{position:relative;padding:0 0 14px 26px}
.steps li::before{content:"";position:absolute;left:5px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:color-mix(in srgb,var(--c) 30%,transparent)}
.steps .w{display:block;color:var(--ct);font-size:11.5px;font-weight:800}
.steps .t{font-weight:700}
.steps .n{color:var(--soft);font-size:12.5px}
.steps li.now::before{background:var(--brand);box-shadow:0 0 0 5px rgba(180,255,0,.3)}
.pill{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;background:var(--brand);color:var(--navy);padding:1px 7px;border-radius:999px;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:110px;background:var(--panel2)}
.chip b{font-size:15px}
.chip span{font-size:12px;color:var(--soft)}
.chip em{font-style:normal;font-size:11px;font-weight:800;color:var(--ct);margin-top:2px}
.chip.past{opacity:.55}
.checks{list-style:none;display:grid;gap:6px}
.checks label{display:grid;grid-template-columns:24px 64px 1fr;gap:10px;align-items:start;padding:9px 10px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);cursor:pointer;transition:border-color .15s,background .15s}
.checks label:hover{border-color:var(--c)}
.checks input{appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--c);display:grid;place-items:center;cursor:pointer;margin-top:1px;transition:background .15s}
.checks input:checked{background:var(--cf);border-color:var(--cf)}
.checks input:checked::after{content:"";width:6px;height:11px;border:solid var(--ci);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.checks .d{font-weight:800;color:var(--ct);font-size:12px;padding-top:3px}
.checks .t{font-weight:700;font-size:13.5px}
.checks .n{display:block;color:var(--soft);font-size:12px;font-weight:500}
.checks .clinic .t{color:var(--ct)}
.checks li.done .t{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--text) 40%,transparent);color:var(--faint)}
.checks li.next label{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.note{color:var(--faint);font-size:12px;margin-top:10px}
.dnav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.dnav span{color:var(--faint);font-size:12px;font-weight:700}
.dnav .tbtn[disabled]{opacity:.35;pointer-events:none}

/* confetti-ish pulse on progress */
@keyframes bump{50%{transform:scale(1.08)}}
.bump{animation:bump .35s ease}

.golist{list-style:none;display:grid;gap:8px}
.golist li{position:relative;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-size:13.5px;font-weight:600}
.golist li::before{content:"";position:absolute;left:12px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--c);opacity:.9}
.golist li::after{content:"";position:absolute;left:17px;top:50%;width:3px;height:6px;margin-top:-5px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.is-light .golist li::after{border-color:#fff}
.grp + .grp{margin-top:16px}
.golist.no li{background:transparent;border-style:dashed;font-weight:500;color:var(--soft)}
.golist.no li::before{background:var(--faint);opacity:.5}
.golist.no li::after{width:8px;height:2px;margin-top:-1px;left:15px;border:0;background:var(--bg);transform:none}
.is-light .golist.no li::after{background:#fff}
#print{display:none}

/* ---------- responsive ---------- */
/* wide screens: map uses map columns sized by variables */
.map{grid-template-columns:minmax(0,1fr) var(--cw) minmax(0,1fr);gap:0 var(--gap-c)}
.left .branch{grid-template-columns:minmax(0,1fr) var(--hubw)}
.right .branch{grid-template-columns:var(--hubw) minmax(0,1fr)}
.branch{gap:0 var(--gap-b)}
.left .branch.closed{grid-template-columns:minmax(0,1fr) var(--hubw)}
.nlist .nx{flex:1 1 0;min-width:0;max-width:330px}
.nl-hint{display:none}

/* laptops 1180–1599: tighter mind map */
@media (max-width:1599px){
  :root{--ring:150px;--cw:214px;--hubw:108px;--gap-c:36px;--gap-b:30px}
  .hub{font-size:12px;padding:9px 8px}
  .nname{font-size:15px}
  .center h2{font-size:21px}
  .side{gap:20px}
}
@media (max-width:1320px){
  :root{--ring:136px;--cw:196px;--hubw:98px;--gap-c:28px;--gap-b:24px}
  .wrap{padding-left:24px;padding-right:24px}
  .node{grid-template-columns:42px minmax(0,1fr) 16px;gap:10px;padding:9px 10px 9px 9px}
  .tile{width:42px;height:42px}.tile img{width:28px;height:28px}

/* short laptop screens: keep the whole map in view */
@media (min-width:1180px) and (max-height:820px){
  .wrap{padding-top:16px}
  .top h1{font-size:24px}
  .nextup{margin-top:10px}
  .map{margin-top:12px}
  .leaves{gap:8px}.side{gap:16px}
  .node{padding-top:8px;padding-bottom:8px}
  .city{margin-top:22px;height:120px}
}

/* tablets 700–1179: hero on top, two columns of branches */
@media (max-width:1179px){
  :root{--ring:124px}
  .map{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 24px;align-items:start;margin-top:22px}
  #wires{display:none}
  .center{grid-column:1/-1;order:-1;width:auto;display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;column-gap:24px;text-align:left;
    background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 28px;box-shadow:var(--shadow);justify-self:stretch}
  .ringwrap{grid-row:1/4;margin:0}
  .center h2{align-self:end}
  .center .prog{align-self:start}
  .left .branch,.right .branch,.left .branch.closed{grid-template-columns:1fr;gap:10px}
  .left .hub,.left .branch.closed .hub{order:0;grid-column:auto}
  .hub{justify-self:start;padding:8px 16px;font-size:12.5px}
  .leaves{padding-left:14px;border-left:2px solid var(--c);margin-left:16px}
  .side{gap:24px}
  .city{margin-top:30px;height:130px}
}

/* phones < 700 */
@media (max-width:699px){
  :root{--ring:104px}
  .wrap{padding:14px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
  .top{flex-direction:column-reverse;align-items:stretch;gap:14px}
  .tools{justify-content:space-between;flex-wrap:nowrap}
  .tools .tbtn{padding:8px 12px}
  #themeTxt{display:none}
  #themeBtn{padding:8px 10px}
  .tools .seg{margin-right:auto}
  .top h1{font-size:22px}
  .eyebrow{font-size:11px}
  .nextup{margin:14px -16px 0}
  .nextup .nl{padding:0 16px}
  .nlist{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 6px;scroll-padding:0 16px;scrollbar-width:none}
  .nlist::-webkit-scrollbar{display:none}
  .nlist .nx{flex:0 0 78%;max-width:none;scroll-snap-align:start}
  .map{grid-template-columns:1fr;gap:22px;margin-top:18px}
  .center{padding:14px 16px;column-gap:16px;justify-content:start;border-radius:18px}
  .center h2{font-size:19px}
  .center .pos{font-size:12.5px;margin-top:4px}
  .center .prog{margin-top:8px;padding-top:8px}
  .leaves{margin-left:10px;padding-left:12px}
  .node{grid-template-columns:42px minmax(0,1fr) 16px;gap:10px;min-height:64px}
  .tile{width:42px;height:42px}.tile img{width:28px;height:28px}
  .stack{height:42px}.av{width:30px;height:30px}
  .nname{font-size:15px}
  .drawer{top:auto;bottom:0;height:min(90vh,90dvh);width:100%;border-radius:22px 22px 0 0;transform:translateY(105%);overflow:hidden;border-left:0}
  .drawer::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:rgba(0,35,64,.35);z-index:3}
  .hero{height:160px}
  .dbody{padding:36px 18px 20px}
  .dbody h3{font-size:21px}
  .checks label{grid-template-columns:24px 56px 1fr;gap:8px}
  .city{height:92px;margin-top:26px}
  .foot{padding:10px 16px calc(20px + env(safe-area-inset-bottom))}
}
@media (max-width:360px){
  .tools #tourBtn span{font-size:12px}

  .ringwrap{grid-row:auto;margin-bottom:8px}

/* phones in landscape / short screens */
@media (max-height:520px) and (orientation:landscape){
  .hero{height:110px}
  .hero img.ill{padding:8px 20px 0}

/* ---------- laptop: everything on one screen ---------- */

@media (min-width:1180px) and (max-height:740px){

@media (min-width:1180px) and (max-height:660px){

/* ---------- light theme polish ---------- */
.is-light body{background:
  radial-gradient(900px 520px at 50% 42%,rgba(180,255,0,.16) 0%,rgba(180,255,0,0) 70%),
  radial-gradient(1200px 760px at 50% 40%,#ffffff 0%,var(--bg) 65%) fixed}
.is-light .eyebrow::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#b4ff00;margin-right:8px;box-shadow:0 0 0 3px rgba(180,255,0,.3);vertical-align:1px}
.is-light .hub{box-shadow:0 6px 16px rgba(0,35,63,.12)}
.is-light .hub:hover{background:var(--cf);filter:brightness(1.04)}
.is-light .node{box-shadow:var(--shadow);border-color:var(--line)}
.is-light .node::after{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.is-light .node:hover{box-shadow:0 2px 4px rgba(0,35,64,.06),0 14px 30px rgba(0,35,64,.10)}
.is-light .center .pos{display:inline-block;background:#b4ff00;color:#00233F;padding:3px 12px;border-radius:10px;font-size:12.5px;line-height:1.35;width:fit-content;justify-self:center}
@media (max-width:1179px){.is-light .center .pos{justify-self:start}}
.is-light .avatar{box-shadow:0 12px 40px rgba(130,200,0,.35)}
.is-light .ring .trk{stroke:#e3eaef}
.is-light .ring .val{stroke:#8fd400}
.is-light .nx .cd{background:#eef3f6;color:#00233F}
.is-light .nx:first-child .cd{background:#b4ff00}
.is-light .nx:hover{border-color:#b4ff00}
.is-light .tbtn,.is-light .seg{box-shadow:0 1px 2px rgba(0,35,64,.05)}
.is-light .bar{background:#edf1f4}
.is-light .chip{background:#f7fafc}
.is-light .checks label{background:#fbfcfd}
.is-light .steps li::before{background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.is-light .drawer{box-shadow:-20px 0 60px rgba(0,35,64,.18)}
.is-light .dnav{background:#fbfcfd}
@media (max-width:1179px){.is-light .center{background:#fff}}

  el.hidden=false;
  el.innerHTML=`<div class="nl">${t.nextUp}</div><div class="nlist">`+nx.map(e=>{const d=days(e[0]);
    return `<button class="nx" data-open="${e[2]}" title="${esc(e[1])}"><span class="cd"><b>${d===0?'✓':d}</b><span>${d===0?t.today:t.daysWord(d)}</span></span>
    <span class="tx"><small>${fmt(e[0])}</small><div>${esc(e[1])}</div></span>${ARROW.replace('class="arrow"','class="arrow go"')}</button>`}).join('')+'</div>';
}

/* ---------- drawer ---------- */
function detailHTML(n){
  const t=T[lang], o=n.o; let h='';
  const desc=typeof o.desc==='function'?o.desc(t.deptOf(DATA.dept)):o.desc;
  h+=`<div class="label">${esc(o.label)}${o.badge?` <span class="badge">${esc(o.badge)}</span>`:''}</div><h3 id="dTitle"${n.muted?' style="color:var(--faint);font-style:italic"':''}>${esc(n.o.title||n.name)}</h3><p class="desc">${esc(desc)}</p>`;
  if(o.go) h+=`<div class="sec"><h4>${esc(o.goT)}</h4><ul class="golist">${o.go.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>`;
  if(o.not) h+=`<div class="sec"><h4>${esc(o.notT)}</h4><ul class="golist no">${o.not.map(g=>`<li>${esc(g)}</li>`).join('')}</ul>${o.notNote?`<p class="note">${esc(o.notNote)}</p>`:''}</div>`;
  if(o.groups) h+=o.groups.map(([g,its])=>`<div class="sec grp"><h4>${esc(g)}</h4><ul class="golist">${its.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
  if(o.members) h+=`<div class="sec"><h4>${esc(o.team)}</h4><div class="team">${o.members.map(m=>`<div>${avHTML(m)}${esc(m[0])}</div>`).join('')}</div></div>`;
  if(o.cad) h+=`<div class="sec"><h4>${t.meet}</h4><ul class="steps">${o.cad.map(([w,a,b])=>`<li><span class="w">${esc(w)}</span><span class="t">${esc(a)}</span>${b?` <span class="n">${esc(b)}</span>`:''}</li>`).join('')}</ul>${o.cad.some(c=>c[1].includes('★'))?`<p class="note">${esc(t.star)}</p>`:''}</div>`;
  if(o.dates) h+=`<div class="sec"><h4>${t.dates}</h4><div class="chips">${o.dates.map(([d,tx])=>{const k=days(d);
     return `<div class="chip${k<0?' past':''}"><b>${fmt(d)}</b><span>${esc(tx)}</span><em>${k<0?t.past:t.inDays(k)}</em></div>`}).join('')}</div></div>`;
  if(o.phases) h+=`<div class="sec"><h4>${t.phases}</h4><ul class="steps">${o.phases.map(([s,e,w,a,b])=>{const now=TODAY>=s&&TODAY<=e;
     return `<li class="${now?'now':''}"><span class="w">${esc(w)}${now?`<span class="pill">${t.nowBadge}</span>`:''}</span><span class="t">${esc(a)}</span><br><span class="n">${esc(b)}</span></li>`}).join('')}</ul></div>`;
  if(o.items){ const nextI=o.items.findIndex((x,j)=>x[0]>=TODAY&&!done.has(key(n.id,j)));
    h+=`<div class="sec"><h4>${t.list}</h4><ul class="checks">${o.items.map(([d,a,b,cl],i)=>{const k=key(n.id,i),c=done.has(k);
     return `<li class="${c?'done':''}${i===nextI&&!c?' next':''}"><label class="${cl?'clinic':''}"><input type="checkbox" data-k="${k}"${c?' checked':''}>
       <span class="d">${fmt(d)}</span><span class="t">${esc(a)}${i===nextI&&!c?`<span class="pill">${t.nextBadge}</span>`:''}${b?`<span class="n">${esc(b)}</span>`:''}</span></label></li>`}).join('')}</ul>
     <p class="note">${t.tick}</p></div>`; }
  return h;
}
function openDrawer(id,silent){
  const N=nodes(), idx=N.findIndex(n=>n.id===id); if(idx<0)return; const n=N[idx], t=T[lang];
  current=id; const dr=document.getElementById('drawer');
  dr.style.cssText=cv(n.b);
  dr.innerHTML=`<div class="hero"><img class="ill" src="${ASSETS.ill[n.ic]}" alt="">
      <button class="x" id="dClose" aria-label="${t.close}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      ${n.photo?`<span class="tile photo"><img src="${ASSETS.people[n.photo]}" alt=""></span>`:`<span class="tile"><img src="${ASSETS.icons[n.ic]}" alt=""></span>`}</div>
    <div class="dbody${n.photo?' ph':''}">${detailHTML(n)}</div>
    <div class="dnav"><button class="tbtn" id="dPrev"${idx===0?' disabled':''}>← ${t.back}</button><span>${idx+1} ${t.of} ${N.length}</span>
      <button class="tbtn primary" id="dNext"${idx===N.length-1?' disabled':''}>${t.next} →</button></div>`;
  document.body.classList.add('dopen');
  document.querySelectorAll('.node').forEach(x=>x.classList.toggle('sel',x.dataset.id===id));
  if(closed.has(n.b)){closed.delete(n.b);render();return;}
  highlight(n.b,id);
  if(!silent){const sel=document.querySelector(`.node[data-id="${id}"]`); if(sel&&innerWidth>600)sel.scrollIntoView({block:'nearest',behavior:'smooth'}); document.getElementById('dClose').focus({preventScroll:true});}
}
function refreshNext(ul){
  const lis=[...ul.querySelectorAll('li')], N=nodes(), n=N.find(x=>x.id===current); if(!n)return;
  lis.forEach(li=>{li.classList.remove('next');li.querySelectorAll('.pill').forEach(p=>p.remove());});
  const i=n.o.items.findIndex((x,j)=>x[0]>=TODAY&&!done.has(key(n.id,j)));
  if(i>=0){lis[i].classList.add('next');const t=lis[i].querySelector('.t');const p=document.createElement('span');p.className='pill';p.textContent=T[lang].nextBadge;
    t.insertBefore(p,t.querySelector('.n'));}
}
function closeDrawer(){document.body.classList.remove('dopen');const id=current;current=null;
  document.querySelectorAll('.node').forEach(x=>x.classList.remove('sel'));highlight(null);
  const el=document.querySelector(`.node[data-id="${id}"]`); if(el)el.focus({preventScroll:true});}
function step(d){const N=nodes(),i=N.findIndex(n=>n.id===current)+d; if(N[i])openDrawer(N[i].id);}

function renderPrint(N){document.getElementById('print').innerHTML=N.map(n=>`<section style="${cv(n.b)}">${detailHTML(n)}</section>`).join('');}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const q=s=>e.target.closest(s);
  if(q('[data-lang]')){lang=q('[data-lang]').dataset.lang;store.set('map-lang',lang);render();return;}
  if(q('#dClose')||q('#scrim')){closeDrawer();return;}
  if(q('#dPrev')){step(-1);return;} if(q('#dNext')){step(1);return;}
  if(q('.hub')){const b=q('.hub').dataset.hub;closed.has(b)?closed.delete(b):closed.add(b);render();return;}
  if(q('.node')){openDrawer(q('.node').dataset.id);return;}
  if(q('[data-open]')){openDrawer(q('[data-open]').dataset.open);return;}
  if(q('#tourBtn')){openDrawer(nodes()[0].id);return;}
  if(q('#avatar')){const N=nodes().filter(n=>n.checks);openDrawer(N.find(n=>countDone(n)<n.o.items.length)?.id||N[0].id);return;}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.k; if(!k)return;
  e.target.checked?done.add(k):done.delete(k); store.set('map-done-'+SLUG,JSON.stringify([...done]));
  const li=e.target.closest('li'); li.classList.toggle('done',e.target.checked); refreshNext(e.target.closest('.checks'));
  updateProgress(); const av=document.querySelector('.ringwrap'); av.classList.remove('bump'); void av.offsetWidth; av.classList.add('bump');
});
document.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('dopen'))return;
  if(e.key==='Escape')closeDrawer(); if(e.key==='ArrowRight')step(1); if(e.key==='ArrowLeft')step(-1);
});
const mapEl=document.getElementById('map');
mapEl.addEventListener('pointerover',e=>{if(current)return;const n=e.target.closest('.node'),h=e.target.closest('.hub');
  if(n)highlight(n.closest('.branch').dataset.b,n.dataset.id); else if(h)highlight(h.dataset.hub); });
mapEl.addEventListener('pointerleave',()=>{if(!current)highlight(null);});
mapEl.addEventListener('pointerout',e=>{if(current)return;if(!e.relatedTarget||!e.relatedTarget.closest||(!e.relatedTarget.closest('.node')&&!e.relatedTarget.closest('.hub')))highlight(null);});

/* ---------- theme ---------- */
const root=document.documentElement; const st=store.get('map-theme'); if(st)root.dataset.theme=st;
function isDark(){const t=root.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function updateTheme(){const d=isDark();root.classList.toggle('is-light',!d);document.getElementById('themeIco').innerHTML=d?SUN:MOON;document.getElementById('themeTxt').textContent=d?T[lang].light:T[lang].dark;document.getElementById('themeBtn').setAttribute('aria-label',d?T[lang].light:T[lang].dark);}
document.getElementById('themeBtn').onclick=()=>{const n=isDark()?'light':'dark';root.dataset.theme=n;store.set('map-theme',n);updateTheme();kick();};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{updateTheme();kick();});

/* ---------- wires ---------- */
const svg=document.getElementById('wires'),NS='http://www.w3.org/2000/svg';
let hot={b:null,n:null};
function curve(x1,y1,x2,y2){const mx=(x1+x2)/2;return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;}
function add(d,color,w,op,b,n){const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class','wire');
  p.setAttribute('stroke',color);p.setAttribute('stroke-width',w);p.setAttribute('stroke-opacity',op);p.dataset.b=b;if(n)p.dataset.n=n;svg.appendChild(p);return p;}
let introUntil=0;
function draw(){
  if(performance.now()<introUntil)return;
  svg.innerHTML=''; if(getComputedStyle(svg).display==='none')return;
  const m=mapEl.getBoundingClientRect(),av=document.querySelector('.ringwrap').getBoundingClientRect(),cy=av.top+av.height/2-m.top;
  const ps=[];
  mapEl.querySelectorAll('.branch').forEach(b=>{
    const L=!!b.closest('.left'),color=getComputedStyle(b).getPropertyValue('--c').trim(),bid=b.dataset.b;
    const h=b.querySelector('.hub').getBoundingClientRect(),hy=h.top+h.height/2-m.top;
    ps.push(add(curve((L?av.left+6:av.right-6)-m.left,cy,(L?h.right:h.left)-m.left,hy),color,2.2,.8,bid));
    if(b.classList.contains('closed'))return;
    b.querySelectorAll('.node').forEach(l=>{const r=l.getBoundingClientRect();
      ps.push(add(curve((L?h.left:h.right)-m.left,hy,(L?r.right:r.left)-m.left,r.top+r.height/2-m.top),color,1.6,.55,bid,l.dataset.id));});
  });
  if(!introDone){introDone=true;introUntil=performance.now()+1150;
    ps.forEach(p=>{const len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len;p.classList.add('intro');});
    setTimeout(()=>{introUntil=0;draw();},1200);}
  applyHot();
}
function highlight(b,n){hot={b,n};applyHot();}
function applyHot(){
  mapEl.classList.toggle('focus',!!hot.b);
  svg.querySelectorAll('.wire').forEach(p=>{const on=hot.b&&p.dataset.b===hot.b&&(!p.dataset.n||!hot.n||p.dataset.n===hot.n);p.classList.toggle('hot',!!on);});
}
let raf=0,until=0;
function loop(){draw();raf=performance.now()<until?requestAnimationFrame(loop):0;}
function kick(){until=performance.now()+450;if(!raf)raf=requestAnimationFrame(loop);}
addEventListener('resize',kick);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(kick);

document.getElementById('town2').src=document.getElementById('town1').src;
render();
</script>
</body>
</html>
